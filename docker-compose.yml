services:
  cosaguardo:
    image: ghcr.io/land2595/cosaguardo:latest
    container_name: cosaguardo
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      # Facoltativa: se vuota, la chiave TMDB si inserisce dalla pagina al primo avvio
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      REFRESH_MINUTES: ${REFRESH_MINUTES:-60}
      MOVIE_DAYS: ${MOVIE_DAYS:-90}
      TV_DAYS: ${TV_DAYS:-30}
      UPCOMING_DAYS: ${UPCOMING_DAYS:-60}
      # Facoltativa: voti Rotten Tomatoes in "I migliori" (si puo' inserire anche dal menu admin)
      OMDB_API_KEY: ${OMDB_API_KEY:-}
      BEST_YEARS: ${BEST_YEARS:-10}
      PLATFORMS: ${PLATFORMS:-netflix,prime,disney,paramount,sky,apple,timvision,raiplay,mediaset,discovery}
      # Facoltativi: richieste dei film a Radarr e delle serie a Sonarr
      RADARR_URL: ${RADARR_URL:-}
      RADARR_API_KEY: ${RADARR_API_KEY:-}
      RADARR_QUALITY_PROFILE: ${RADARR_QUALITY_PROFILE:-}
      RADARR_ROOT_FOLDER: ${RADARR_ROOT_FOLDER:-}
      SONARR_URL: ${SONARR_URL:-}
      SONARR_API_KEY: ${SONARR_API_KEY:-}
      SONARR_QUALITY_PROFILE: ${SONARR_QUALITY_PROFILE:-}
      SONARR_ROOT_FOLDER: ${SONARR_ROOT_FOLDER:-}
      # Facoltativo: PIN del menu admin (se vuoto lo scegli dalla pagina)
      ADMIN_PIN: ${ADMIN_PIN:-}
      # Facoltativi: Plex, per vedere cosa hai gia' (e i titoli gia' visti)
      PLEX_URL: ${PLEX_URL:-}
      PLEX_TOKEN: ${PLEX_TOKEN:-}
      # Facoltativi: "Suggeriti per te" con l'AI (si possono impostare anche dal menu admin)
      AI_PROVIDER: ${AI_PROVIDER:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      # Facoltativi: Yamtrack, per i titoli gia' visti
      YAMTRACK_URL: ${YAMTRACK_URL:-}
      YAMTRACK_USER: ${YAMTRACK_USER:-}
      YAMTRACK_PASSWORD: ${YAMTRACK_PASSWORD:-}
    volumes:
      - cosaguardo-data:/data

volumes:
  cosaguardo-data:
